name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: myusername
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: test_db
      POSTGRES_HOST: localhost

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Start PostgreSQL
        run: docker compose up -d db

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL (attempt $attempt/30)..."
            sleep 2
          done

          echo "PostgreSQL did not become ready in time"
          docker compose logs --no-color db
          exit 1

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test -v ./...

      - name: Show PostgreSQL logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color db

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
